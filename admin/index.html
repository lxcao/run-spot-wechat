<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>甲骨文魔都跑团 · 后台管理</title>
  <!-- CloudBase Web SDK（本地 567KB ESM 文件，自动挂载 window.cloudbase） -->
  <script type="module" src="./cloudbase-esm.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #C74634 0%, #A12B1A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      padding: 40px 30px;
      width: 100%;
      max-width: 460px;
    }
    .logo { text-align: center; font-size: 56px; margin-bottom: 12px; }
    h1 { text-align: center; color: #C74634; font-size: 22px; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
    .step {
      background: #fafafa;
      border-left: 3px solid #C74634;
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.7;
      color: #333;
    }
    .step strong { color: #C74634; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #C74634 0%, #A12B1A 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
      word-break: break-all;
    }
    .msg.error { display: block; background: #fee; color: #c33; }
    .msg.success { display: block; background: #efe; color: #3a3; }
    .uid-box {
      margin-top: 16px;
      padding: 14px;
      background: #FFF8F0;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      display: none;
    }
    .uid-label { font-size: 12px; color: #FF9800; margin-bottom: 6px; }
    .uid-text {
      font-family: monospace;
      font-size: 12px;
      color: #333;
      word-break: break-all;
    }
    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏃‍♂️</div>
    <h1>甲骨文魔都跑团</h1>
    <p class="subtitle">后台管理系统</p>

    <div class="step">
      <strong>📋 首次登录步骤：</strong><br>
      ① 点击下方按钮，自动匿名登录<br>
      ② 显示您的专属 openid，点击复制<br>
      ③ 微信发给群主 → 群主加入 team.admins<br>
      ④ 再次点击按钮 → 永久免登录
    </div>

    <button class="btn" id="loginBtn" onclick="login()">
      🚀 登录 / 获取匿名 ID
    </button>

    <div class="uid-box" id="uidBox">
      <div class="uid-label">👇 您的匿名 ID（点击复制）</div>
      <div class="uid-text" id="uidText" onclick="copyUid()"></div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="footer">
      v5 网页后台 · CloudBase Web SDK + 云函数
    </div>
  </div>

  <script type="module">
    const ENV_ID = 'run-spot-prod-d1gb2jd1j3ce2e7fb';

    function showMsg(text, type) {
      type = type || 'error';
      const msg = document.getElementById('msg');
      msg.className = 'msg ' + type;
      msg.textContent = text;
    }

    function copyUid() {
      const uid = document.getElementById('uidText').textContent;
      if (!uid || uid === '加载中...') return;
      navigator.clipboard.writeText(uid).then(() => {
        showMsg('✅ 匿名 ID 已复制！发给群主吧', 'success');
      }).catch(() => {
        const range = document.createRange();
        range.selectNode(document.getElementById('uidText'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        showMsg('已选中，请按 Ctrl+C 复制', 'success');
      });
    }

    async function login() {
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        if (!window.cloudbase) {
          throw new Error('SDK 未加载，请检查 cloudbase-esm.js 是否在同目录');
        }
        const cb = window.cloudbase;

        const app = cb.init({ env: ENV_ID });

        const auth = app.auth();
        const loginState = await auth.hasLoginState();
        if (!loginState) {
          await auth.signInAnonymously();
        }
        const user = auth.currentUser;
        if (!user) {
          throw new Error('匿名登录失败，请重试');
        }
        const uid = user.uid;

        document.getElementById('uidText').textContent = uid;
        document.getElementById('uidBox').style.display = 'block';

        const res = await app.callFunction({
          name: 'adminLogin',
          data: { openid: uid },
        });

        if (res.result && res.result.code === 0) {
          showMsg('✅ 登录成功！欢迎，' + (res.result.data.teamName || '管理员'), 'success');
          sessionStorage.setItem('admin_uid', uid);
          sessionStorage.setItem('admin_team', JSON.stringify(res.result.data));
          setTimeout(() => {
            window.location.href = 'events.html';
          }, 1500);
        } else {
          showMsg('❌ ' + (res.result && res.result.msg || '登录失败：未授权'), 'error');
        }
      } catch (err) {
        console.error('登录错误', err);
        showMsg('❌ ' + (err.message || '未知错误'), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 登录 / 获取匿名 ID';
      }
    }
  </script>
</body>
</html>
