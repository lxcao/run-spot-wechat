<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>甲骨文魔都跑团 · 后台管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #C74634 0%, #A12B1A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      padding: 40px 30px;
      width: 100%;
      max-width: 440px;
    }
    .logo { text-align: center; font-size: 56px; margin-bottom: 12px; }
    h1 { text-align: center; color: #C74634; font-size: 22px; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
    .step {
      background: #f8f9fa;
      border-left: 3px solid #C74634;
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
    }
    .step strong { color: #C74634; }
    .step code {
      background: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      border: 1px solid #ddd;
      word-break: break-all;
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: monospace;
      box-sizing: border-box;
    }
    input:focus { outline: none; border-color: #C74634; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #C74634 0%, #A12B1A 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .msg.error { display: block; background: #fee; color: #c33; }
    .msg.success { display: block; background: #efe; color: #3a3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏃‍♂️</div>
    <h1>甲骨文魔都跑团</h1>
    <p class="subtitle">后台管理系统</p>

    <div class="step">
      <strong>📱 第 1 步：</strong> 打开微信，搜索"甲骨文魔都跑团"小程序 → 进入后点 <strong>⚙️ 配置</strong> → 看到"未授权"页面 → <strong>点击您的 openid 复制</strong>（按钮会自动复制到剪贴板）→ <strong>微信发给自己</strong>
    </div>
    <div class="step">
      <strong>🔑 第 2 步：</strong> 把上一步复制的 openid 粘到下面 → 点"登录"
    </div>

    <div class="form-group">
      <label>您的 openid</label>
      <input
        type="text"
        id="openidInput"
        placeholder="oXxxXxxXxxXxxXxxXxxX（类似这种）"
        autocomplete="off" />
    </div>

    <button class="btn" id="loginBtn" onclick="login()">登 录</button>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    async function login() {
      const openid = document.getElementById('openidInput').value.trim();
      const btn = document.getElementById('loginBtn');
      const msgEl = document.getElementById('msg');

      if (!openid) {
        msgEl.className = 'msg error';
        msgEl.textContent = '❌ 请先粘贴您的 openid';
        return;
      }
      if (!openid.startsWith('oX') || openid.length < 20) {
        msgEl.className = 'msg error';
        msgEl.textContent = '❌ openid 格式不对，应该以"o"开头，长度约 28 字符';
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';
      msgEl.className = 'msg';

      try {
        // 调用 adminLogin 云函数（HTTP 触发器）
        const res = await fetch('/adminLogin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ openid }),
        });

        if (!res.ok) {
          throw new Error('HTTP ' + res.status + '：可能还没在 CloudBase 配置 HTTP 触发器');
        }

        const result = await res.json();

        if (result.code === 0) {
          msgEl.className = 'msg success';
          msgEl.textContent = '✅ 登录成功！欢迎，' + (result.data.teamName || '管理员');
          // 保存 openid 到 sessionStorage
          sessionStorage.setItem('admin_openid', openid);
          sessionStorage.setItem('admin_team', JSON.stringify(result.data));
          // 1 秒后跳转
          setTimeout(() => {
            window.location.href = 'events.html?openid=' + encodeURIComponent(openid);
          }, 1000);
        } else {
          msgEl.className = 'msg error';
          msgEl.textContent = '❌ ' + (result.msg || '登录失败');
        }
      } catch (err) {
        msgEl.className = 'msg error';
        msgEl.textContent = '❌ ' + (err.message || '网络错误');
      } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    }

    // 回车键提交
    document.getElementById('openidInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
